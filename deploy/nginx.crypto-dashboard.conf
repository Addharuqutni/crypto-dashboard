# nginx reverse proxy for crypto-dashboard
# Prefer: sudo bash deploy/setup-domain.sh your.domain --tls you@email.com
#
# Manual install:
#   1. Replace example.com with your domain
#   2. sudo cp deploy/nginx.crypto-dashboard.conf /etc/nginx/sites-available/crypto-dashboard
#   3. sudo ln -sf /etc/nginx/sites-available/crypto-dashboard /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d example.com -d www.example.com
#
# DNS: A record example.com → VPS public IP (and www CNAME/A if used).
# App must listen on 127.0.0.1:3000 (PM2 crypto-dashboard-web).
# Python agent stays on 127.0.0.1:8000 and is NOT exposed publicly.

upstream crypto_dashboard_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /_next/static/ {
        proxy_pass http://crypto_dashboard_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://crypto_dashboard_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
